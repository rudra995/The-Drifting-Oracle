apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifting-oracle-frontend
  labels:
    app: drifting-oracle-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drifting-oracle-frontend
  template:
    metadata:
      labels:
        app: drifting-oracle-frontend
    spec:
      containers:
        - name: frontend
          image: drifting-oracle-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
