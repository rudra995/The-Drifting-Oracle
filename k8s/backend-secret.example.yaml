# Copy to backend-secret.yaml, fill in real values, and DO NOT commit it
# (matches the .env / .env.example convention used for local dev).
# Apply with: kubectl apply -f k8s/backend-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: drifting-oracle-backend-secrets
type: Opaque
stringData:
  GEMINI_API_KEY: ""
  LLAMA_ENDPOINT: "http://localhost:11434/api/generate"
  LLAMA_MODEL: "qwen2.5-coder:7b"
  DATABRICKS_HOST: ""
  DATABRICKS_TOKEN: ""
  DATABRICKS_CATALOG: "drifting_oracle"
  DATABRICKS_SCHEMA: "monitoring"
  DATABRICKS_HTTP_PATH: ""
  MLFLOW_TRACKING_URI: "databricks"
  MLFLOW_REGISTRY_URI: "databricks-uc"
  # Minimal shared-secret API gate (optional) -- leave blank to leave every
  # route open. See backend/.env.example.
  API_KEY: ""
