server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes -- fall back to index.html instead
    # of a raw 404 so refreshing on e.g. /drift-detection still works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
